<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='16 18 22 12 16 6'></polyline><polyline points='8 6 2 12 8 18'></polyline></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mr.Explorer is a Full Stack software developer building web applications with Laravel, React, and Tailwind CSS." />
    <title>Mr.Explorer | Software Developer</title>
    <style>
      html.app-preloading #root { opacity: 0; }
      html.app-preloading, html.app-preloading body { background: #111827; }
      #boot-loader {
        position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
        background: #111827; color: #f8fafc; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        animation: boot-loader-enter .35s ease-out both;
      }
      #boot-loader-content { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
      #boot-loader-logo { width: 64px; height: 64px; display: grid; place-items: center; border: 1px solid #38bdf8; border-radius: 12px; color: #38bdf8; font-size: 20px; font-weight: 700; box-shadow: 0 0 28px rgba(56,189,248,.45); animation: boot-logo-pulse 1.5s ease-in-out infinite; }
      #boot-loader-kicker { color: #38bdf8; font-size: 11px; letter-spacing: .25em; text-transform: uppercase; }
      #boot-loader-name { margin-top: 8px; font-size: 28px; font-weight: 700; }
      #boot-loader-command { margin-top: 10px; color: #94a3b8; font-size: 12px; }
      #boot-loader-command strong { color: #38bdf8; }
      .boot-loader-leaving { animation: boot-loader-leave .5s ease-in both !important; pointer-events: none; }
      @keyframes boot-loader-enter { from { opacity: 0; } to { opacity: 1; } }
      @keyframes boot-loader-leave { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }
      @keyframes boot-logo-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      html.light-mode #boot-loader { background: #f8fafc; color: #182230; }
      @media (prefers-reduced-motion: reduce) { #boot-loader, #boot-loader-logo { animation: none; } }
    </style>
    <script>
      (() => {
        const savedTheme = window.localStorage.getItem("portfolio-theme") || "dark";
        document.documentElement.classList.toggle("dark", savedTheme === "dark");
        document.documentElement.classList.toggle("light-mode", savedTheme === "light");
        document.documentElement.classList.add("app-preloading");
        document.documentElement.style.colorScheme = savedTheme;
        document.documentElement.style.backgroundColor = savedTheme === "dark" ? "#111827" : "#f8fafc";
      })();
    </script>
    <!-- Google Fonts for Inter and JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-accent selection:text-background min-h-screen">
    <div id="boot-loader" role="status" aria-label="Loading portfolio">
      <div id="boot-loader-content">
        <div id="boot-loader-logo">&gt;_</div>
        <div>
          <div id="boot-loader-kicker">Initializing portfolio</div>
          <div id="boot-loader-name">Mr.Explorer</div>
          <div id="boot-loader-command"><strong>&gt;_</strong> load experience<span>▋</span></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
